<!-- GoatCounter 阅读次数；查询失败时不伪造计数。 -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const counter = document.getElementById('pageviews');
    if (!counter) return;

    counter.textContent = '—';
    {% if jekyll.environment == 'production' %}
    const path = location.pathname.replace(/\/$/, '') || '/';
    const url = 'https://{{ site.analytics.goatcounter.id }}.goatcounter.com/counter/'
      + encodeURIComponent(path) + '.json';
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('Counter unavailable');
      const data = await response.json();
      const digits = String(data.count ?? '').replace(/\D/g, '');
      if (!digits) throw new Error('Invalid counter');
      counter.textContent = new Intl.NumberFormat('zh-CN').format(Number(digits));
      counter.title = 'GoatCounter 阅读次数（存在缓存，非实时更新）';
    } catch {
      counter.title = '阅读次数暂不可用，请稍后再试';
    }
    {% else %}
    counter.title = '本地预览不查询线上阅读次数';
    {% endif %}
  });
</script>
